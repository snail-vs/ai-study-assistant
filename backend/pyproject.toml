[project]
name = "studycenter-backend"
version = "0.1.0"
description = "Backend for the StudyCenter learning space"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "python-dotenv>=1.0,<2",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
