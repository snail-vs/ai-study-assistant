apiVersion: apps/v1
kind: Deployment
metadata:
  name: studycenter-backend
  namespace: studycenter
  labels:
    app.kubernetes.io/name: studycenter-backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: studycenter-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studycenter-backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: backend
          image: 192.168.0.202:5000/snail/studycenter-backend:main-initial
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL
              value: sqlite:////data/studycenter.db
            - name: STUDYCENTER_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: studycenter-runtime
                  key: encryption-key
            - name: AI_PROVIDER
              value: auto
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: studycenter-data

