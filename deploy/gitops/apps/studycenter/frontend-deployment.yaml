apiVersion: apps/v1
kind: Deployment
metadata:
  name: studycenter-frontend
  namespace: studycenter
  labels:
    app.kubernetes.io/name: studycenter-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: studycenter-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: studycenter-frontend
    spec:
      automountServiceAccountToken: false
      containers:
        - name: frontend
          image: 192.168.0.202:5000/snail/studycenter-frontend:main-initial
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
          livenessProbe:
            httpGet:
              path: /
              port: http
      
