openapi: 3.1.0
info:
  title: StudyCenter API
  version: 0.1.0
  description: Contract for the StudyCenter learning-space and knowledge-card API.
servers:
  - url: /api/v1
paths:
  /settings/providers:
    get:
      operationId: getProviderSettings
      responses:
        '200':
          description: Runtime provider status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/providers/{providerName}:
    parameters:
      - name: providerName
        in: path
        required: true
        schema: { type: string, enum: [deepseek, opencode, openrouter] }
    put:
      operationId: configureProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureProviderRequest'
      responses:
        '200':
          description: Provider configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
    delete:
      operationId: clearProvider
      responses:
        '200':
          description: Provider cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/providers/{providerName}/models:
    parameters:
      - name: providerName
        in: path
        required: true
        schema: { type: string, enum: [deepseek, opencode, openrouter] }
    post:
      operationId: discoverProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverModelsRequest'
      responses:
        '200':
          description: Models available from the provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverModelsResponse'
  /settings/model:
    put:
      operationId: selectModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
      responses:
        '200':
          description: Model selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/model-routes:
    get:
      operationId: getModelRoutes
      responses:
        '200':
          description: Task model routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRoute'
    put:
      operationId: configureModelRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureTaskRoutesRequest'
      responses:
        '200':
          description: Updated provider settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /agents:
    get:
      operationId: listAgents
      responses:
        '200':
          description: Available StudyCenter agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentDefinition'
  /learning-spaces:
    post:
      operationId: createLearningSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearningSpaceRequest'
      responses:
        '201':
          description: Learning space created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpace'
    get:
      operationId: listLearningSpaces
      responses:
        '200':
          description: Learning spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpaceList'
  /learning-spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getLearningSpace
      responses:
        '200':
          description: Learning space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpace'
        '404':
          $ref: '#/components/responses/NotFound'
  /learning-spaces/{spaceId}/runtime:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getLearningRuntime
      responses:
        '200':
          description: Last persisted learning position and branch return path
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LearningRuntime'
                  - type: 'null'
    put:
      operationId: updateLearningRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearningRuntimeRequest'
      responses:
        '200':
          description: Persisted learning runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRuntime'
  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: getKnowledgeCard
      responses:
        '200':
          description: Knowledge card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteKnowledgeCard
      responses:
        '200':
          description: Knowledge card soft-deleted
          content:
            application/json:
              schema:
                type: object
                required: [status, cardId]
                properties:
                  status: { type: string, enum: [deleted] }
                  cardId: { type: string }
  /learning-spaces/{spaceId}/cards:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listKnowledgeCards
      responses:
        '200':
          description: Knowledge cards in the learning space
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createKnowledgeCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeCardRequest'
      responses:
        '201':
          description: Knowledge card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listConversations
      responses:
        '200':
          description: Conversations for a card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /cards/{cardId}/proposals:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listCardProposals
      responses:
        '200':
          description: Pending recommendations for a card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatedCardProposal'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/sections/{sectionId}/guidance:
    parameters:
      - $ref: '#/components/parameters/CardId'
      - name: sectionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listTeacherGuidance
      responses:
        '200':
          description: Teacher guidance history for a card section
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherGuidance'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createSectionTeacherGuidance
      responses:
        '201':
          description: Initial teacher guidance for a card section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherGuidance'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/sections/{sectionId}/activities:
    parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/SectionId'
    get:
      operationId: listSectionActivities
      responses:
        '200':
          description: Activities attached to the section
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LearningActivity' }
  /cards/{cardId}/sections/{sectionId}/activities/quiz:
    parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/SectionId'
    post:
      operationId: generateSectionQuiz
      responses:
        '200':
          description: Ready knowledge check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningActivity'
  /activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      operationId: getLearningActivity
      responses:
        '200':
          description: Learning activity without answer key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningActivity'
  /activities/{activityId}/attempts:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    post:
      operationId: submitActivityAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActivityAttemptRequest'
      responses:
        '200':
          description: Evaluated attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAttempt'
  /activities/{activityId}/attempts/latest:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      operationId: getLatestActivityAttempt
      responses:
        '200':
          description: Latest attempt, if any
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActivityAttempt'
                  - type: 'null'
  /conversations/{conversationId}/messages/stream:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: streamConversationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: Server-sent AI events
          content:
            text/event-stream:
              schema:
                type: string
  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listConversationMessages
      responses:
        '200':
          description: Persisted messages in the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
  /proposals/{proposalId}/accept:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acceptRelatedCardProposal
      responses:
        '201':
          description: Related knowledge card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /proposals/{proposalId}/discussion:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: startProposalDiscussion
      responses:
        '201':
          description: New isolated discussion session for a recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'
  /proposals/{proposalId}/reject:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rejectRelatedCardProposal
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema:
                type: object
                required: [status, proposalId]
                properties:
                  status: { type: string, enum: [rejected] }
                  proposalId: { type: string }
  /cards/{cardId}/notes:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listNotes
      responses:
        '200':
          description: Notes for a card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
  /notes:
    get:
      operationId: listAllNotes
      responses:
        '200':
          description: All notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
  /notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
    delete:
      operationId: deleteNote
      responses:
        '200':
          description: Note deleted
components:
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
    SectionId:
      name: sectionId
      in: path
      required: true
      schema: { type: string }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ProviderSettings:
      type: object
      required: [activeProvider, activeModel, providers, models, taskRoutes]
      properties:
        activeProvider: { type: string }
        activeModel: { type: string, nullable: true }
        providers:
          type: object
          additionalProperties: { type: boolean }
        models:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        taskRoutes:
          type: object
          additionalProperties: { type: string }
    TaskRoute:
      type: object
      required: [id, label, category]
      properties:
        id: { type: string }
        label: { type: string }
        category: { type: string }
        model: { type: string, nullable: true }
    ConfigureTaskRoutesRequest:
      type: object
      required: [routes]
      properties:
        routes:
          type: object
          additionalProperties: { type: string }
    AgentDefinition:
      type: object
      required: [id, name, role, description, visible, priority]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        description: { type: string }
        visible: { type: boolean }
        priority: { type: integer }
    ConfigureProviderRequest:
      type: object
      required: [models]
      properties:
        apiKey: { type: string, minLength: 1, nullable: true, writeOnly: true }
        models:
          type: array
          minItems: 1
          items: { type: string }
        defaultModel: { type: string, minLength: 1, nullable: true, deprecated: true }
        taskRoutes:
          type: object
          description: Values use provider:model, for example deepseek:deepseek-chat.
          additionalProperties: { type: string }
    DiscoverModelsRequest:
      type: object
      properties:
        apiKey: { type: string, minLength: 1, nullable: true, writeOnly: true }
    DiscoverModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { type: string }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    CreateLearningSpaceRequest:
      type: object
      required: [title, learningGoal]
      properties:
        title: { type: string, minLength: 1 }
        learningGoal: { type: string, minLength: 1 }
    LearningSpace:
      type: object
      required: [id, title, learningGoal, rootCardId, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        learningGoal: { type: string }
        rootCardId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    LearningSpaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LearningSpace' }
        nextCursor: { type: string, nullable: true }
    KnowledgeCard:
      type: object
      required: [id, spaceId, title, cardType, status, sections]
      properties:
        id: { type: string }
        spaceId: { type: string }
        parentCardId: { type: string, nullable: true }
        parentSectionId: { type: string, nullable: true }
        sourceConversationId: { type: string, nullable: true }
        title: { type: string }
        cardType: { type: string, enum: [root, related] }
        status: { type: string, enum: [draft, active, completed, deleted] }
        deletedAt: { type: string, format: date-time, nullable: true }
        sections:
          type: array
          items: { $ref: '#/components/schemas/CardSection' }
    CreateKnowledgeCardRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        cardType: { type: string, enum: [root, related], default: root }
        parentCardId: { type: string, nullable: true }
        parentSectionId: { type: string, nullable: true }
        sourceConversationId: { type: string, nullable: true }
    CardSection:
      type: object
      required: [id, title, orderIndex, contentMarkdown, contentType]
      properties:
        id: { type: string }
        title: { type: string }
        orderIndex: { type: integer }
        contentMarkdown: { type: string }
        contentType: { type: string, enum: [concept, practice, summary, quiz, interactive] }
        teachingObjective: { type: string, nullable: true }
        learningStatus: { type: string, enum: [unread, learning, completed] }
    LearningNavigationEntry:
      type: object
      required: [cardId]
      properties:
        cardId: { type: string }
        sectionId: { type: string, nullable: true }
    UpdateLearningRuntimeRequest:
      type: object
      required: [currentCardId, navigationStack]
      properties:
        currentCardId: { type: string }
        currentSectionId: { type: string, nullable: true }
        navigationStack:
          type: array
          items: { $ref: '#/components/schemas/LearningNavigationEntry' }
        eventType: { type: string, default: navigation }
    LearningRuntime:
      type: object
      required: [id, spaceId, currentCardId, navigationStack, updatedAt]
      properties:
        id: { type: string }
        spaceId: { type: string }
        currentCardId: { type: string, nullable: true }
        currentSectionId: { type: string, nullable: true }
        sourceCardId: { type: string, nullable: true }
        sourceSectionId: { type: string, nullable: true }
        navigationStack:
          type: array
          items: { $ref: '#/components/schemas/LearningNavigationEntry' }
        updatedAt: { type: string, format: date-time }
    QuizOption:
      type: object
      required: [id, text]
      properties:
        id: { type: string }
        text: { type: string }
    QuizQuestion:
      type: object
      required: [id, type, prompt, options]
      properties:
        id: { type: string }
        type: { type: string, enum: [single_choice, true_false, short_answer] }
        prompt: { type: string }
        options:
          type: array
          items: { $ref: '#/components/schemas/QuizOption' }
    LearningActivity:
      type: object
      required: [id, cardId, sectionId, activityType, title, status, questions, createdAt]
      properties:
        id: { type: string }
        cardId: { type: string }
        sectionId: { type: string }
        activityType: { type: string, enum: [quiz, practice, lab] }
        title: { type: string }
        objective: { type: string, nullable: true }
        status: { type: string }
        questions:
          type: array
          items: { $ref: '#/components/schemas/QuizQuestion' }
        latestAttempt:
          oneOf:
            - $ref: '#/components/schemas/ActivityAttempt'
            - type: 'null'
        createdAt: { type: string, format: date-time }
    SubmitActivityAttemptRequest:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          additionalProperties: {}
    ActivityResultItem:
      type: object
      required: [questionId, correct, score, feedback]
      properties:
        questionId: { type: string }
        correct: { type: boolean }
        score: { type: integer }
        feedback: { type: string }
        referenceAnswer: { type: string, nullable: true }
    ActivityAttempt:
      type: object
      required: [id, activityId, status, results, createdAt]
      properties:
        id: { type: string }
        activityId: { type: string }
        status: { type: string }
        score: { type: integer, nullable: true }
        masteryLevel: { type: string, nullable: true }
        diagnosticSummary: { type: string, nullable: true }
        results:
          type: array
          items: { $ref: '#/components/schemas/ActivityResultItem' }
        createdAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time, nullable: true }
    TeacherGuidance:
      type: object
      required: [id, cardId, sectionId, trigger, content, createdAt]
      properties:
        id: { type: string }
        cardId: { type: string }
        sectionId: { type: string }
        sourceConversationId: { type: string, nullable: true }
        trigger: { type: string, enum: [section_enter, side_question, activity_result] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    CreateConversationRequest:
      type: object
      required: [conversationType, title, rootQuestion]
      properties:
        sectionId: { type: string, nullable: true }
        conversationType: { type: string, enum: [main, side] }
        title: { type: string }
        rootQuestion: { type: string }
        mode: { type: string, enum: [single, group], default: single }
        participantIds:
          type: array
          items: { type: string }
        triggerAgentId: { type: string, nullable: true }
        directorPolicy: { type: string, enum: [guided, deterministic, llm], default: guided }
    Conversation:
      type: object
      required: [id, cardId, conversationType, title, status, createdAt]
      properties:
        id: { type: string }
        cardId: { type: string }
        sectionId: { type: string, nullable: true }
        conversationType: { type: string, enum: [main, side] }
        title: { type: string }
        mode: { type: string, enum: [single, group] }
        participantIds:
          type: array
          items: { type: string }
        triggerAgentId: { type: string, nullable: true }
        directorPolicy: { type: string, enum: [guided, deterministic, llm] }
        status: { type: string, enum: [active, completed, archived] }
        createdAt: { type: string, format: date-time }
    RelatedCardProposal:
      type: object
      required: [id, cardId, title, reason, status, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string, nullable: true }
        activityId: { type: string, nullable: true }
        cardId: { type: string }
        sectionId: { type: string, nullable: true }
        title: { type: string }
        reason: { type: string }
        status: { type: string, enum: [pending, discussing, accepted, rejected] }
        generatedCardId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    CreateMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        clientMessageId: { type: string, nullable: true }
    Message:
      type: object
      required: [id, conversationId, role, content, messageType, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        senderId: { type: string, nullable: true }
        senderName: { type: string, nullable: true }
        senderRole: { type: string, nullable: true }
        visibility: { type: string, enum: [user, internal] }
        content: { type: string }
        messageType: { type: string }
        createdAt: { type: string, format: date-time }
    CreateNoteRequest:
      type: object
      required: [content]
      properties:
