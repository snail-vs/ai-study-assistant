openapi: 3.1.0
info:
  title: StudyCenter API
  version: 0.1.0
  description: Contract for the StudyCenter learning-space and knowledge-card API.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Registered and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
  /auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
  /auth/logout:
    post:
      operationId: logout
      responses:
        '204': { description: Signed out }
  /auth/me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthUser' }
  /settings/providers:
    get:
      operationId: getProviderSettings
      responses:
        '200':
          description: Runtime provider status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/providers/{providerName}:
    parameters:
      - name: providerName
        in: path
        required: true
        schema: { type: string, enum: [deepseek, google, opencode, openrouter, chatgpt] }
    put:
      operationId: configureProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureProviderRequest'
      responses:
        '200':
          description: Provider configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
    delete:
      operationId: clearProvider
      responses:
        '200':
          description: Provider cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/providers/{providerName}/models:
    parameters:
      - name: providerName
        in: path
        required: true
        schema: { type: string, enum: [deepseek, google, opencode, openrouter, chatgpt] }
    post:
      operationId: discoverProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverModelsRequest'
      responses:
        '200':
          description: Models available from the provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverModelsResponse'
  /settings/providers/chatgpt/oauth/login:
    post:
      operationId: startChatGptLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                method: { type: string, enum: [device_code, browser], default: device_code }
      responses:
        '200':
          description: Login started (device code or browser PKCE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGptLogin'
  /settings/providers/chatgpt/oauth/status:
    post:
      operationId: getChatGptLoginStatus
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId]
              properties:
                sessionId: { type: string }
      responses:
        '200':
          description: Device-code login status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGptLoginStatus'
  /settings/providers/chatgpt/oauth/complete:
    post:
      operationId: completeChatGptLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sessionId, input]
              properties:
                sessionId: { type: string }
                input: { type: string, minLength: 1 }
      responses:
        '200':
          description: Browser PKCE login completion
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGptLoginStatus'
  /settings/providers/chatgpt/oauth/logout:
    post:
      operationId: logoutChatGpt
      responses:
        '200':
          description: ChatGPT logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/model:
    put:
      operationId: selectModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
      responses:
        '200':
          description: Model selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/model-routes:
    get:
      operationId: getModelRoutes
      responses:
        '200':
          description: Task model routes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskRoute'
    put:
      operationId: configureModelRoutes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureTaskRoutesRequest'
      responses:
        '200':
          description: Updated provider settings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /agents:
    get:
      operationId: listAgents
      responses:
        '200':
          description: Available StudyCenter agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AgentDefinition'
  /learning-spaces:
    post:
      operationId: createLearningSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearningSpaceRequest'
      responses:
        '202':
          description: Learning space queued for asynchronous generation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpace'
    get:
      operationId: listLearningSpaces
      responses:
        '200':
          description: Learning spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpaceList'
  /course-design/turn:
    post:
      operationId: courseDesignTurn
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseDesignTurnRequest' }
      responses:
        '200':
          description: Next course intake question or ready preview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseDesignTurnResponse' }
  /course-design/outline:
    post:
      operationId: courseDesignOutline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseOutlineRequest' }
      responses:
        '200':
          description: Generated course outline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseOutlineResponse' }
        '502':
          description: AI did not return a valid outline
  /course-design/outline/revise:
    post:
      operationId: reviseCourseDesignOutline
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CourseOutlineRevisionRequest' }
      responses:
        '200':
          description: Revised course outline
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CourseOutlineRevisionResponse' }
        '502':
          description: AI did not return a valid outline
  /learning-spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getLearningSpace
      responses:
        '200':
          description: Learning space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpace'
        '404':
          $ref: '#/components/responses/NotFound'
  /learning-spaces/{spaceId}/generation:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getCourseGenerationStatus
      responses:
        '200':
          description: Course generation status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenerationStatus'
    put:
      operationId: retryCourseGeneration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearningSpaceRequest'
      responses:
        '200':
          description: Failed course generation queued again
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpace'
        '409':
          description: Course generation is not eligible for retry
  /learning-spaces/{spaceId}/runtime:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getLearningRuntime
      responses:
        '200':
          description: Last persisted learning position and branch return path
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/LearningRuntime'
                  - type: 'null'
    put:
      operationId: updateLearningRuntime
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLearningRuntimeRequest'
      responses:
        '200':
          description: Persisted learning runtime
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningRuntime'
  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: getKnowledgeCard
      responses:
        '200':
          description: Knowledge card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: deleteKnowledgeCard
      responses:
        '200':
          description: Knowledge card soft-deleted
          content:
            application/json:
              schema:
                type: object
                required: [status, cardId]
                properties:
                  status: { type: string, enum: [deleted] }
                  cardId: { type: string }
  /learning-spaces/{spaceId}/cards:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listKnowledgeCards
      responses:
        '200':
          description: Knowledge cards in the learning space
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createKnowledgeCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeCardRequest'
      responses:
        '201':
          description: Knowledge card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listConversations
      parameters:
        - name: sectionId
          in: query
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Conversations for one course section
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /cards/{cardId}/proposals:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listCardProposals
      responses:
        '200':
          description: Pending recommendations for a card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RelatedCardProposal'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/sections/{sectionId}/guidance:
    parameters:
      - $ref: '#/components/parameters/CardId'
      - name: sectionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listTeacherGuidance
      responses:
        '200':
          description: Teacher guidance history for a card section
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherGuidance'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createSectionTeacherGuidance
      responses:
        '201':
          description: Initial teacher guidance for a card section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherGuidance'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/sections/{sectionId}/activities:
    parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/SectionId'
    get:
      operationId: listSectionActivities
      responses:
        '200':
          description: Activities attached to the section
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LearningActivity' }
  /cards/{cardId}/sections/{sectionId}/activities/quiz:
    parameters:
      - $ref: '#/components/parameters/CardId'
      - $ref: '#/components/parameters/SectionId'
    post:
      operationId: generateSectionQuiz
      responses:
        '200':
          description: Ready knowledge check
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningActivity'
  /activities/{activityId}:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      operationId: getLearningActivity
      responses:
        '200':
          description: Learning activity without answer key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningActivity'
  /activities/{activityId}/attempts:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    post:
      operationId: submitActivityAttempt
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActivityAttemptRequest'
      responses:
        '200':
          description: Evaluated attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAttempt'
  /activities/{activityId}/attempts/latest:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
    get:
      operationId: getLatestActivityAttempt
      responses:
        '200':
          description: Latest attempt, if any
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ActivityAttempt'
                  - type: 'null'
  /activities/{activityId}/attempts/{attemptId}/follow-up:
    parameters:
      - $ref: '#/components/parameters/ActivityId'
      - name: attemptId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: submitActivityFollowUp
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmitActivityFollowUpRequest'
      responses:
        '200':
          description: Updated activity attempt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityAttempt'
        '409': { description: Follow-up is not pending }
  /conversations/{conversationId}/messages/stream:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: streamConversationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: Server-sent AI events
          content:
            text/event-stream:
              schema:
                type: string
  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listConversationMessages
      responses:
        '200':
          description: Persisted messages in the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
  /proposals/{proposalId}/accept:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acceptRelatedCardProposal
      responses:
        '201':
          description: Related knowledge card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /proposals/{proposalId}/discussion:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: startProposalDiscussion
      responses:
        '201':
          description: New isolated discussion session for a recommendation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '404':
          $ref: '#/components/responses/NotFound'
  /proposals/{proposalId}/reject:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rejectRelatedCardProposal
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema:
                type: object
                required: [status, proposalId]
                properties:
                  status: { type: string, enum: [rejected] }
                  proposalId: { type: string }
  /cards/{cardId}/notes:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listNotes
      responses:
        '200':
          description: Notes for a card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
  /notes:
    get:
      operationId: listAllNotes
      responses:
        '200':
          description: All notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
  /notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
    delete:
      operationId: deleteNote
      responses:
        '200':
          description: Note deleted
components:
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
    SectionId:
      name: sectionId
      in: path
      required: true
      schema: { type: string }
    ActivityId:
      name: activityId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ProviderSettings:
      type: object
      required: [activeProvider, activeModel, providers, models, taskRoutes]
      properties:
        activeProvider: { type: string }
        activeModel: { type: string, nullable: true }
        providers:
          type: object
          additionalProperties: { type: boolean }
        models:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        taskRoutes:
          type: object
          additionalProperties: { type: string }
    TaskRoute:
      type: object
      required: [id, label, category]
      properties:
        id: { type: string }
        label: { type: string }
        category: { type: string }
        model: { type: string, nullable: true }
    ConfigureTaskRoutesRequest:
      type: object
      required: [routes]
      properties:
        routes:
          type: object
          additionalProperties: { type: string }
    AgentDefinition:
      type: object
      required: [id, name, role, description, visible, priority]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
        description: { type: string }
        visible: { type: boolean }
        priority: { type: integer }
    ConfigureProviderRequest:
      type: object
      required: [models]
      properties:
        apiKey: { type: string, minLength: 1, nullable: true, writeOnly: true }
        models:
          type: array
          minItems: 1
          items: { type: string }
        defaultModel: { type: string, minLength: 1, nullable: true, deprecated: true }
        taskRoutes:
          type: object
          description: Values use provider:model, for example deepseek:deepseek-chat.
          additionalProperties: { type: string }
    DiscoverModelsRequest:
      type: object
      properties:
        apiKey: { type: string, minLength: 1, nullable: true, writeOnly: true }
    DiscoverModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { type: string }
    ChatGptLogin:
      type: object
      required: [sessionId, method]
      properties:
        sessionId: { type: string }
        method: { type: string, enum: [device_code, browser] }
        authUrl: { type: string, nullable: true }
        userCode: { type: string, nullable: true }
        verificationUri: { type: string, nullable: true }
        intervalSeconds: { type: integer, nullable: true }
    ChatGptLoginStatus:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [pending, done, failed, unknown] }
        accountId: { type: string, nullable: true }
        expires: { type: integer, nullable: true }
        error: { type: string, nullable: true }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    CreateLearningSpaceRequest:
      type: object
      required: [title, learningGoal]
      properties:
        title: { type: string, minLength: 1 }
        learningGoal: { type: string, minLength: 1 }
        courseBrief: { $ref: '#/components/schemas/CourseBrief' }
        courseScale: { type: string, enum: [quick, standard, series], default: standard }
        courseOutline: { type: array, maxItems: 12, items: { $ref: '#/components/schemas/CourseOutlineItem' } }
    CourseBrief:
      type: object
      properties:
        topic: { type: string }
        learningOutcome: { type: string }
        learningGoals: { type: array, maxItems: 20, items: { type: string } }
        learningGoalDetails: { type: string }
        priorKnowledge: { type: string }
        priorKnowledgeLevels: { type: array, maxItems: 20, items: { type: string } }
        priorKnowledgeDetails: { type: string }
        useCase: { type: string }
        focus: { type: array, items: { type: string } }
        excludedTopics: { type: array, items: { type: string } }
        preferredStyle: { type: array, items: { type: string } }
        timeBudgetMinutes: { type: integer, nullable: true }
    CourseIntakeMessage:
      type: object
      required: [role, content]
      properties:
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
    CourseOutlineItem:
      type: object
      required: [title, objective]
      properties:
        title: { type: string }
        objective: { type: string }
    CourseDesignTurnRequest:
      type: object
      properties:
        messages: { type: array, items: { $ref: '#/components/schemas/CourseIntakeMessage' } }
        brief: { $ref: '#/components/schemas/CourseBrief' }
        courseScale: { type: string, enum: [quick, standard, series] }
        skip: { type: boolean, default: false }
    CourseDesignTurnResponse:
      type: object
      required: [brief, assistantMessage, ready, recommendedScale, courseScale, outline, turn]
      properties:
        brief: { $ref: '#/components/schemas/CourseBrief' }
        assistantMessage: { type: string }
        question: { type: string, nullable: true }
        quickOptions: { type: array, items: { type: string } }
        ready: { type: boolean }
        recommendedScale: { type: string, enum: [quick, standard, series] }
