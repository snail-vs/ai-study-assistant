openapi: 3.1.0
info:
  title: StudyCenter API
  version: 0.1.0
  description: Contract for the StudyCenter learning-space and knowledge-card API.
servers:
  - url: /api/v1
paths:
  /settings/providers:
    get:
      operationId: getProviderSettings
      responses:
        '200':
          description: Runtime provider status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/providers/{providerName}:
    parameters:
      - name: providerName
        in: path
        required: true
        schema: { type: string, enum: [deepseek, opencode, openrouter] }
    put:
      operationId: configureProvider
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigureProviderRequest'
      responses:
        '200':
          description: Provider configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
    delete:
      operationId: clearProvider
      responses:
        '200':
          description: Provider cleared
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /settings/providers/{providerName}/models:
    parameters:
      - name: providerName
        in: path
        required: true
        schema: { type: string, enum: [deepseek, opencode, openrouter] }
    post:
      operationId: discoverProviderModels
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverModelsRequest'
      responses:
        '200':
          description: Models available from the provider
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverModelsResponse'
  /settings/model:
    put:
      operationId: selectModel
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [model]
              properties:
                model: { type: string }
      responses:
        '200':
          description: Model selected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderSettings'
  /health:
    get:
      operationId: getHealth
      responses:
        '200':
          description: Service health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /learning-spaces:
    post:
      operationId: createLearningSpace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLearningSpaceRequest'
      responses:
        '201':
          description: Learning space created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpace'
    get:
      operationId: listLearningSpaces
      responses:
        '200':
          description: Learning spaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpaceList'
  /learning-spaces/{spaceId}:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: getLearningSpace
      responses:
        '200':
          description: Learning space
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LearningSpace'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: getKnowledgeCard
      responses:
        '200':
          description: Knowledge card
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /learning-spaces/{spaceId}/cards:
    parameters:
      - $ref: '#/components/parameters/SpaceId'
    get:
      operationId: listKnowledgeCards
      responses:
        '200':
          description: Knowledge cards in the learning space
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createKnowledgeCard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKnowledgeCardRequest'
      responses:
        '201':
          description: Knowledge card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /cards/{cardId}/conversations:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listConversations
      responses:
        '200':
          description: Conversations for a card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Conversation'
    post:
      operationId: createConversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateConversationRequest'
      responses:
        '201':
          description: Conversation created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
  /cards/{cardId}/sections/{sectionId}/guidance:
    parameters:
      - $ref: '#/components/parameters/CardId'
      - name: sectionId
        in: path
        required: true
        schema: { type: string }
    get:
      operationId: listTeacherGuidance
      responses:
        '200':
          description: Teacher guidance history for a card section
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeacherGuidance'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      operationId: createSectionTeacherGuidance
      responses:
        '201':
          description: Initial teacher guidance for a card section
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeacherGuidance'
        '404':
          $ref: '#/components/responses/NotFound'
  /conversations/{conversationId}/messages/stream:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    post:
      operationId: streamConversationMessage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMessageRequest'
      responses:
        '200':
          description: Server-sent AI events
          content:
            text/event-stream:
              schema:
                type: string
  /conversations/{conversationId}/messages:
    parameters:
      - $ref: '#/components/parameters/ConversationId'
    get:
      operationId: listConversationMessages
      responses:
        '200':
          description: Persisted messages in the conversation
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Message'
        '404':
          $ref: '#/components/responses/NotFound'
  /proposals/{proposalId}/accept:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: acceptRelatedCardProposal
      responses:
        '201':
          description: Related knowledge card created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeCard'
        '404':
          $ref: '#/components/responses/NotFound'
  /proposals/{proposalId}/reject:
    parameters:
      - name: proposalId
        in: path
        required: true
        schema: { type: string }
    post:
      operationId: rejectRelatedCardProposal
      responses:
        '200':
          description: Proposal rejected
          content:
            application/json:
              schema:
                type: object
                required: [status, proposalId]
                properties:
                  status: { type: string, enum: [rejected] }
                  proposalId: { type: string }
  /cards/{cardId}/notes:
    parameters:
      - $ref: '#/components/parameters/CardId'
    get:
      operationId: listNotes
      responses:
        '200':
          description: Notes for a card
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
    post:
      operationId: createNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateNoteRequest'
      responses:
        '201':
          description: Note created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
  /notes:
    get:
      operationId: listAllNotes
      responses:
        '200':
          description: All notes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Note'
  /notes/{noteId}:
    parameters:
      - name: noteId
        in: path
        required: true
        schema: { type: string }
    patch:
      operationId: updateNote
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: Note updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Note'
    delete:
      operationId: deleteNote
      responses:
        '200':
          description: Note deleted
components:
  parameters:
    SpaceId:
      name: spaceId
      in: path
      required: true
      schema: { type: string }
    CardId:
      name: cardId
      in: path
      required: true
      schema: { type: string }
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string }
  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ProviderSettings:
      type: object
      required: [activeProvider, activeModel, providers, models]
      properties:
        activeProvider: { type: string }
        activeModel: { type: string, nullable: true }
        providers:
          type: object
          additionalProperties: { type: boolean }
        models:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    ConfigureProviderRequest:
      type: object
      required: [models, defaultModel]
      properties:
        apiKey: { type: string, minLength: 1, nullable: true, writeOnly: true }
        models:
          type: array
          minItems: 1
          items: { type: string }
        defaultModel: { type: string, minLength: 1 }
    DiscoverModelsRequest:
      type: object
      properties:
        apiKey: { type: string, minLength: 1, nullable: true, writeOnly: true }
    DiscoverModelsResponse:
      type: object
      required: [models]
      properties:
        models:
          type: array
          items: { type: string }
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string, example: ok }
    CreateLearningSpaceRequest:
      type: object
      required: [title, learningGoal]
      properties:
        title: { type: string, minLength: 1 }
        learningGoal: { type: string, minLength: 1 }
    LearningSpace:
      type: object
      required: [id, title, learningGoal, rootCardId, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        learningGoal: { type: string }
        rootCardId: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
    LearningSpaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LearningSpace' }
        nextCursor: { type: string, nullable: true }
    KnowledgeCard:
      type: object
      required: [id, spaceId, title, cardType, status, sections]
      properties:
        id: { type: string }
        spaceId: { type: string }
        parentCardId: { type: string, nullable: true }
        sourceConversationId: { type: string, nullable: true }
        title: { type: string }
        cardType: { type: string, enum: [root, related] }
        status: { type: string, enum: [draft, active, completed] }
        sections:
          type: array
          items: { $ref: '#/components/schemas/CardSection' }
    CreateKnowledgeCardRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        cardType: { type: string, enum: [root, related], default: root }
        parentCardId: { type: string, nullable: true }
        sourceConversationId: { type: string, nullable: true }
    CardSection:
      type: object
      required: [id, title, orderIndex, contentMarkdown]
      properties:
        id: { type: string }
        title: { type: string }
        orderIndex: { type: integer }
        contentMarkdown: { type: string }
        learningStatus: { type: string, enum: [unread, learning, completed] }
    TeacherGuidance:
      type: object
      required: [id, cardId, sectionId, trigger, content, createdAt]
      properties:
        id: { type: string }
        cardId: { type: string }
        sectionId: { type: string }
        sourceConversationId: { type: string, nullable: true }
        trigger: { type: string, enum: [section_enter, side_question] }
        content: { type: string }
        createdAt: { type: string, format: date-time }
    CreateConversationRequest:
      type: object
      required: [conversationType, title, rootQuestion]
      properties:
        sectionId: { type: string, nullable: true }
        conversationType: { type: string, enum: [main, side] }
        title: { type: string }
        rootQuestion: { type: string }
    Conversation:
      type: object
      required: [id, cardId, conversationType, title, status, createdAt]
      properties:
        id: { type: string }
        cardId: { type: string }
        sectionId: { type: string, nullable: true }
        conversationType: { type: string, enum: [main, side] }
        title: { type: string }
        status: { type: string, enum: [active, completed, archived] }
        createdAt: { type: string, format: date-time }
    CreateMessageRequest:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1 }
        clientMessageId: { type: string, nullable: true }
    Message:
      type: object
      required: [id, conversationId, role, content, messageType, createdAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        role: { type: string, enum: [user, assistant, system] }
        content: { type: string }
        messageType: { type: string }
        createdAt: { type: string, format: date-time }
    CreateNoteRequest:
      type: object
      required: [content]
      properties:
        sectionId: { type: string, nullable: true }
        conversationId: { type: string, nullable: true }
        sourceMessageId: { type: string, nullable: true }
        title: { type: string, nullable: true, maxLength: 200 }
        content: { type: string, minLength: 1 }
        sourceType: { type: string, enum: [manual, saved_message], default: manual }
    UpdateNoteRequest:
      type: object
      properties:
        title: { type: string, nullable: true, maxLength: 200 }
        content: { type: string, minLength: 1 }
    Note:
      type: object
      required: [id, cardId, title, content, sourceType, createdAt, updatedAt]
      properties:
        id: { type: string }
        cardId: { type: string }
        sectionId: { type: string, nullable: true }
        conversationId: { type: string, nullable: true }
        sourceMessageId: { type: string, nullable: true }
        title: { type: string }
        content: { type: string }
        sourceType: { type: string, enum: [manual, saved_message] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            details: { type: object }
            requestId: { type: string }
